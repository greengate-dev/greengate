name: greengate
description: >-
  Zero-trust DevOps security gate — scans for secrets, SAST issues,
  vulnerable dependencies, coverage gaps, CI misconfigurations, and more
  in one fast Rust binary. No Docker required.
author: greengate-dev
branding:
  icon: shield
  color: green

inputs:
  version:
    description: >-
      greengate release tag to download, e.g. "v0.4.0".
      Use "latest" to always pull the newest release
      (pin to a specific version for reproducible CI).
    required: false
    default: latest
  profile:
    description: >-
      Quality profile to apply: "strict" (90 % coverage, tighter entropy),
      "relaxed" (70 % coverage), or "ci" (default — 80 % + SAST enabled,
      code-smell rules silenced to reduce noise).
    required: false
    default: ci
  args:
    description: Extra arguments forwarded verbatim to `greengate run`.
    required: false
    default: ''
  report:
    description: >-
      Where to write the merged report: SARIF 2.1.0 when the path ends in
      ".sarif", otherwise greengate.report/v1 JSON. Defaults to a JSON file
      in RUNNER_TEMP.
    required: false
    default: ''
  dependency-review:
    description: >-
      "true" to also run `greengate deps review --annotate` on pull requests:
      one comment summarising the dependency changes (updated in place) and a
      check run annotating the lockfile lines. Needs `contents: read`,
      `pull-requests: write` and `checks: write`, and a checkout with
      history (`fetch-depth: 0`) so the merge base can be found.
    required: false
    default: 'false'

outputs:
  status:
    description: >-
      Overall result: passed, findings, incomplete or error.
      Empty if the report could not be read.
    value: ${{ steps.run.outputs.status }}
  findings:
    description: >-
      Total number of findings across all pipeline steps and, when enabled,
      the dependency review.
    value: ${{ steps.run.outputs.findings }}
  incomplete:
    description: Number of checks that did not complete.
    value: ${{ steps.run.outputs.incomplete }}
  report-path:
    description: Path of the report file written by the run.
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: composite
  steps:
    # ── Download the correct binary for the runner platform ───────────────────
    - name: Install greengate
      id: install
      shell: bash
      env:
        GREENGATE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        VERSION="$GREENGATE_VERSION"
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(curl -sSfL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/greengate-dev/greengate/releases/latest" \
            | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve latest greengate version. Set inputs.version explicitly."
            exit 1
          fi
        fi

        OS="$(uname -s)"
        ARCH="$(uname -m)"
        # Asset names must match those published by .github/workflows/release.yml.
        case "${OS}-${ARCH}" in
          Linux-x86_64)                       ASSET="greengate-linux-amd64"       ;;
          Darwin-arm64)                       ASSET="greengate-macos-arm64"       ;;
          Darwin-x86_64)                      ASSET="greengate-macos-amd64"       ;;
          MINGW*-x86_64|MSYS*-x86_64|CYGWIN*-x86_64) ASSET="greengate-windows-amd64.exe" ;;
          *)
            echo "::error::greengate action: unsupported platform ${OS}-${ARCH}"
            exit 1
            ;;
        esac

        INSTALL_DIR="${HOME}/.local/bin"
        mkdir -p "$INSTALL_DIR"

        URL="https://github.com/greengate-dev/greengate/releases/download/${VERSION}/${ASSET}"
        echo "Downloading greengate ${VERSION} (${ASSET})..."
        curl -sSfL "$URL" -o "${INSTALL_DIR}/greengate"
        chmod +x "${INSTALL_DIR}/greengate"
        echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

        echo "greengate ${VERSION} installed to ${INSTALL_DIR}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    # ── Execute the pipeline defined in .greengate.toml ───────────────────────
    - name: Run greengate
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        # Inputs reach the script through the environment, never through
        # `${{ }}` inside it, so an input carrying shell syntax stays data.
        GG_PROFILE: ${{ inputs.profile }}
        GG_ARGS: ${{ inputs.args }}
        GG_REPORT: ${{ inputs.report }}
        GG_DEPENDENCY_REVIEW: ${{ inputs.dependency-review }}
      run: |
        set -uo pipefail
        set -f  # GG_ARGS is word-split on purpose; never glob-expand it

        REPORT="${GG_REPORT:-${RUNNER_TEMP:-/tmp}/greengate-report.json}"
        # A report left by an earlier run must not stand in for this one if
        # greengate exits before writing (e.g. a usage error).
        rm -f "$REPORT"
        PROFILE_ARGS=()
        if [ -n "$GG_PROFILE" ]; then
          PROFILE_ARGS=(--profile "$GG_PROFILE")
        fi

        # The review writes the same format as the run, so the two merge.
        case "$REPORT" in
          *.sarif|*.SARIF) REVIEW_REPORT="${RUNNER_TEMP:-/tmp}/greengate-deps-review.sarif" ;;
          *)               REVIEW_REPORT="${RUNNER_TEMP:-/tmp}/greengate-deps-review.json" ;;
        esac
        rm -f "$REVIEW_REPORT"
        REVIEW_CODE=0
        if [ "$GG_DEPENDENCY_REVIEW" = "true" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          greengate ${PROFILE_ARGS[@]+"${PROFILE_ARGS[@]}"} deps review --annotate \
            --report "$REVIEW_REPORT"
          REVIEW_CODE=$?
        fi

        # shellcheck disable=SC2086
        greengate run ${PROFILE_ARGS[@]+"${PROFILE_ARGS[@]}"} --report "$REPORT" $GG_ARGS
        CODE=$?
        # Findings (1) outrank every other result; otherwise the higher code.
        if [ "$CODE" -ne 1 ] && [ "$REVIEW_CODE" -ne 0 ]; then
          if [ "$REVIEW_CODE" -eq 1 ] || [ "$REVIEW_CODE" -gt "$CODE" ]; then
            CODE=$REVIEW_CODE
          fi
        fi

        case "$REPORT" in
          *.sarif|*.SARIF)
            # One run per command; the review's run follows the pipeline's.
            MERGE='.[0].runs += .[1].runs | .[0]'
            FILTER_STATUS='if all(.runs[]; .invocations[0].executionSuccessful) then (if ([.runs[].results | length] | add) > 0 then "findings" else "passed" end) else "incomplete" end'
            FILTER_FINDINGS='[.runs[].results | length] | add'
            FILTER_INCOMPLETE='[.runs[].invocations[0].toolExecutionNotifications // [] | length] | add'
            ;;
          *)
            # The review's checks under deps-review/, its findings with the
            # pipeline's, and the worse status (findings > error > incomplete).
            MERGE='def rank: {"passed": 0, "incomplete": 1, "error": 2, "findings": 3}[.] // 0;
              .[0] as $p | .[1] as $r
              | $p + {
                  status: (if ($r.status | rank) > ($p.status | rank) then $r.status else $p.status end),
                  checks: ($p.checks + ($r.checks | map(.id = "deps-review/" + .id))),
                  findings: ($p.findings + $r.findings),
                  warnings: (($p.warnings // []) + ($r.warnings // [])),
                  suppressed: (($p.suppressed // []) + ($r.suppressed // []))
                }'
            FILTER_STATUS='.status'
            FILTER_FINDINGS='.findings | length'
            FILTER_INCOMPLETE='[.checks[] | select(.status != "passed")] | length'
            ;;
        esac
        # The outputs and the report describe both commands, like the exit code.
        if [ -f "$REPORT" ] && [ -f "$REVIEW_REPORT" ]; then
          if command -v jq >/dev/null 2>&1 \
            && jq -s "$MERGE" "$REPORT" "$REVIEW_REPORT" > "$REPORT.merged"; then
            mv "$REPORT.merged" "$REPORT"
          else
            rm -f "$REPORT.merged"
            echo "::warning::greengate action: could not merge the dependency review into $REPORT; see $REVIEW_REPORT"
          fi
        fi

        echo "report-path=${REPORT}" >> "$GITHUB_OUTPUT"
        if [ -f "$REPORT" ] && command -v jq >/dev/null 2>&1; then
          echo "status=$(jq -r "$FILTER_STATUS" "$REPORT")" >> "$GITHUB_OUTPUT"
          echo "findings=$(jq -r "$FILTER_FINDINGS" "$REPORT")" >> "$GITHUB_OUTPUT"
          echo "incomplete=$(jq -r "$FILTER_INCOMPLETE" "$REPORT")" >> "$GITHUB_OUTPUT"
        fi

        # 0 passed · 1 findings · 2 usage/config error · 3 incomplete · 4 error
        exit "$CODE"
