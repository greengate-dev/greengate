[package]
name = "greengate"
version = "0.3.4"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.5.60", features = ["derive"] }
ignore = "0.4.25"
indicatif = "0.18.4"
rayon = "1.11.0"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
streaming-iterator = "0.1"
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
ureq = { version = "2", features = ["json"] }
roxmltree = "0.20"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

# Overflow wraps silently in release by default, so the same arithmetic behaves
# differently than it does in debug and in tests. For a tool whose output gates
# a build, a loud panic beats a silently wrong count.
[profile.release]
overflow-checks = true

[lints.rust]
# The crate contains no `unsafe` at all; keep it that way deliberately rather
# than by accident.
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
# NOTE: `unwrap_used`, `expect_used` and `indexing_slicing` are deliberately NOT
# enabled repo-wide. Auditing them site by site found ~66 hits in non-test code
# and nearly all are provably in range — `serde_json::Value` indexing (which is
# total), `[0u32; 256]` indexed by a `u8`, and slices behind explicit bounds
# guards. Turning them on would mean ~66 blanket `#[allow]`s, which would hide
# the next real one. Run them on demand instead:
#   cargo clippy --all-targets -- -W clippy::unwrap_used -W clippy::indexing_slicing
