# greengate self-scan configuration
# Excludes files that intentionally contain fake/example secret patterns
# (test fixtures, documentation examples, and regex pattern definitions)

# greengate self-scan configuration
# Excludes files that intentionally contain fake/example secret patterns
# (test fixtures, documentation examples, and regex pattern definitions)

[scan]
exclude_patterns = [
    # Integration tests contain deliberate fake patterns as test fixtures
    "tests/**",
    # Benchmark corpus + manifest are, by design, full of synthetic secrets
    # (fixtures the scanner is measured against) — never self-scan them.
    "bench/**",
    # Unit tests inside scanner.rs use fake patterns to verify detection works
    "src/modules/scanner.rs",
    # audit.rs test fixtures contain go.sum hash strings (not secrets)
    "src/modules/audit.rs",
    # README and docs contain pattern examples and documentation snippets
    "README.md",
    "docs/**",
    # Cargo.lock contains SHA-256 package checksums (not secrets)
    "Cargo.lock",
    # Build artifacts
    "target/**",
    # Git internals
    ".git/**",
]

# Shannon entropy detection (v0.2.0)
# Tokens with entropy above this threshold are flagged as potential secrets.
# Lower = more sensitive (more false positives); higher = more specific.
entropy = true
entropy_threshold = 4.5
entropy_min_length = 20

[deps]
# Parser fixtures pin old, deliberately vulnerable versions; they are not
# greengate's dependencies.
exclude_patterns = ["tests/fixtures/**", "bench/**"]

[sast]
# Disable rules that generate expected false positives in greengate's own source:
# - RustUnwrap/RustExpect: used on compiled regexes and in test helpers where
#   panic is the correct behaviour (LOW severity, too noisy to suppress inline).
# - RustCommandNew: suppressed inline with `// greengate: ignore` on each
#   intentional Command::new call so intent is documented at the call site.
disabled_rules = [
    "SAST/RustUnwrap",
    "SAST/RustExpect",
]

[coverage]
file = "coverage/lcov.info"
min = 80.0

[lint]
target_dir = "."

# ── Supply chain protection ───────────────────────────────────────────────────
# Drives `greengate watch-install <pm> install`.
# block_phantom_scripts — exit non-zero if a postinstall script creates and
#   then deletes a file inside node_modules/ (dropper signature).
# enforce_sandbox — also flag new executables dropped in the project root
#   that were not present before the install began.
# allow_postinstall — packages whose postinstall scripts legitimately create
#   temp files (e.g. native build tools that compile .node addons).
#   Findings from these are reported as warnings, not errors.
#
# [supply_chain]
# block_phantom_scripts = true
# enforce_sandbox       = true
# allow_postinstall     = ["esbuild", "prisma", "@swc/core"]
